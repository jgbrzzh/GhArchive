[package]
name = "gharchive-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Scheduled GitHub mirror backups for Windows"
repository = "https://github.com/jgbrzzh/GhArchive"
default-run = "gharchive-desktop"

[lib]
name = "gharchive"

[[bin]]
name = "gharchive"
path = "src/bin/gharchive.rs"

[[bin]]
name = "gharchive-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-opener"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ghboost-core = { path = "../.deps/ghboost-core" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "string"] }
dirs = "6"
dunce = "1"
fs2 = "0.4"
futures = "0.3"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
